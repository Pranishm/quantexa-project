[project]
name = "quantexa-backend"
version = "0.1.0"
description = "Quantitative multi-asset intelligence and backtesting platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.11",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyarrow>=16",
    "duckdb>=1.0",
    "yfinance>=1.7",
    "hmmlearn>=0.3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
